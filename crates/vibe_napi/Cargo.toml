[package]
name = "vibe_napi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Node bindings (napi-rs) exposing the Vibe runtime to JavaScript."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vibe_shared = { path = "../vibe_shared" }
vibe_errors = { path = "../vibe_errors" }
vibe_cancellation = { path = "../vibe_cancellation" }
vibe_retry = { path = "../vibe_retry" }
vibe_scheduler = { path = "../vibe_scheduler" }
vibe_execution = { path = "../vibe_execution" }
vibe_tools = { path = "../vibe_tools" }
vibe_model = { path = "../vibe_model" }
napi = { workspace = true }
napi-derive = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
napi-build = "2"

[dev-dependencies]
vibe_shared = { path = "../vibe_shared" }
vibe_cancellation = { path = "../vibe_cancellation" }
vibe_retry = { path = "../vibe_retry" }
vibe_model = { path = "../vibe_model" }
vibe_errors = { path = "../vibe_errors" }
vibe_tools = { path = "../vibe_tools" }

[features]
default = []
