[workspace]
resolver = "2"
members = [
    "crates/vibe_shared",
    "crates/vibe_errors",
    "crates/vibe_cancellation",
    "crates/vibe_retry",
    "crates/vibe_scheduler",
    "crates/vibe_execution",
    "crates/vibe_tools",
    "crates/vibe_model",
    "crates/vibe_napi",
    "crates/vibe_bundler",
    "crates/vibe_tokenizer",
    "crates/vibe_sse",
    "crates/vibe_bindings",
    "benchmarks",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/frontal-labs/vibe"
authors = ["Vibe contributors"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
parking_lot = "0.12"
napi = { version = "2.14", default-features = false, features = ["napi8", "tokio_rt", "async"] }
napi-derive = "2.14"
simd-json = "0.13"
proptest = "1"
criterion = "0.5"
dashmap = "6"
schemars = "0.8"
jsonschema = "0.18"
uuid = { version = "1", features = ["v4", "serde"] }
async-stream = "0.3"
futures = "0.3"
bytes = "1"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
async-trait = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
pin-project = "1"
pin-utils = "0.1"
insta = "1"
clap = { version = "4", features = ["derive"] }
notify = "6"
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
