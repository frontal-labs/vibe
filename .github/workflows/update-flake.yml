name: Update Flake Lock

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-flake:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch all history to get all tags and branches
          fetch-depth: 0
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v12
        with:
          # Determine the install URL based on the OS
          # (linux, darwin, or other)
          # The action automatically detects the OS
          extra_conf: |
            experimental-features = nix-command flakes
      - name: Update flake.lock
        run: nix flake update
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: chore: update flake.lock
          committer: GitHub <noreply@github.com>
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          title: chore: update flake.lock
          body: |
            This PR updates the flake.lock file to the latest versions of inputs.
          branch: update-flake-label
          labels: |
            automated-pr
          assignees:
            - ${{ github.actor }}
          reviewers: |
            - octocat
