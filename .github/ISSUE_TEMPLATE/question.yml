name: Question
description: Ask a question about the project
title: "[Question]: "
labels: ["question"]
assignees:
  - octocat
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to ask a question!
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Please ask your question clearly and concisely.
      placeholder: |
        I'm wondering how to ...
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: What area of the project is your question about?
      multiple: false
      options:
        - General
        - Installation
        - Usage
        - Configuration
        - Development
        - Documentation
        - Other
  - type: textarea
    id: context
    attributes:
      label: Context
      description: |
        Please provide any relevant context for your question.
        This might include what you're trying to accomplish, what you've tried so far, etc.
      placeholder: |
        I'm trying to achieve X, but I'm encountering Y. I've tried Z but it didn't work.
    validations:
      required: false
  - type: textarea
    id: version
    attributes:
      label: Version
      description: What version of the software are you using?
      placeholder: |
        v1.0.0
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this question, you agree to follow our [Code of Conduct](https://github.com/your-org/your-repo/blob/main/CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
